plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "numismatic_reimagined.mixins.json"
    }

    runs {
        forgeClient {
            vmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
            vmArgs "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED"
            vmArgs "--add-opens", "java.base/java.util=ALL-UNNAMED"
            vmArgs "--add-opens", "java.base/java.io=ALL-UNNAMED"
            vmArgs "--add-opens", "java.base/sun.security.ssl=ALL-UNNAMED"
            vmArgs "--add-exports", "java.base/sun.security.ssl=ALL-UNNAMED"
            vmArgs "--add-opens", "java.base/java.security.cert=ALL-UNNAMED"
            vmArgs "--add-opens", "cpw.mods.bootstraplauncher/cpw.mods.bootstraplauncher=ALL-UNNAMED"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven { url "https://maven.blamejared.com/" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    // JEI (dev only)
    modCompileOnlyApi "mezz.jei:jei-1.20.1-forge-api:${rootProject.jei_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

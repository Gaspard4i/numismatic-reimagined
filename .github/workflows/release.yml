name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip phase tags (v*-phaseN) pour l'instant — publish seulement sur vraies releases.
    if: ${{ !contains(github.ref, 'phase') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish to Modrinth + CurseForge + GitHub Release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|common)).jar
            neoforge/build/libs/!(*-@(dev|sources|javadoc|common)).jar

          loaders: |
            fabric
            neoforge
          game-versions: |
            1.21.1
          version-type: alpha
          dependencies: |
            architectury-api(required)
            fabric-api(required){fabric}

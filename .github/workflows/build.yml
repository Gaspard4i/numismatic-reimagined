name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Cache Loom (Minecraft assets/jars/mappings)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build & test
        run: ./gradlew build test jacocoTestReport --stacktrace

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/test/html/'

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mod-jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            !**/*-dev.jar
            !**/*-sources.jar
